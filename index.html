<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tools</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Critical CSS inlined to reduce critical request chain for LCP -->
  <style id="critical-css">
    :root{--accent:#0b6b5f;--bg:#ffffff;--muted:#6b6b6b}
    html,body{height:100%;margin:0;font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;background:#f5f7f8;color:#0b1820}
    .wrap{max-width:980px;margin:36px auto;padding:28px;background:var(--bg);box-shadow:0 6px 18px rgba(16,24,40,0.06);border-radius:8px}
    h1{margin:0 0 10px;font-size:20px}
    p.lead{margin:0 0 18px;color:var(--muted)}
    .grid{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px}
    .tool{display:inline-flex;align-items:center;justify-content:center;padding:12px 16px;border-radius:8px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;min-width:160px}
    .tool.secondary{background:#fff;color:var(--accent);border:1px solid #d1e7e2}
    @media (max-width:640px){.grid{flex-direction:column}.tool{width:100%}}
    /* Footer critical styles to avoid layout shift */
    .site-footer{background:transparent;margin-top:20px}
    .site-footer .footer{display:flex;gap:12px;justify-content:center;align-items:center;padding:12px 16px;border-top:1px solid #eef3f4;background:var(--bg);font-size:13px;color:var(--muted);flex-wrap:wrap}
    .site-footer .footer a{color:var(--accent);text-decoration:none;font-weight:600}
    .gh-icon{width:16px;height:16px;vertical-align:middle;margin-right:8px;fill:currentColor}
    .footer a span{vertical-align:middle}
  </style>
  <link rel="preload" href="styles/site.css" as="style" onload="this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="styles/site.css"></noscript>
  <meta name="description" content="Static tools for Plug.Events: quick exports and utilities for umbrella event data.">
</head>
<body>
  <main role="main" class="wrap">
    <h1>Tools</h1>
    <p class="lead">Click a tool to open it.</p>

    <div id="toolsGrid" class="grid">
      <!-- Buttons will be populated here by scripts that scan the tools/ folder -->
    </div>
  </main>

  <script>
    async function tryFetchText(url){
      try{
        const res = await fetch(url, {cache:'no-store'});
        if (!res.ok) return null;
        return await res.text();
      }catch(e){
        return null;
      }
    }

    function extractTitleFromHtml(html){
      try{
        const m = html.match(/<title>([\s\S]*?)<\/title>/i);
        if (m && m[1]) return m[1].trim();
      }catch(e){}
      return null;
    }

    function normalizeHref(href){
      try{
        const u = new URL(href, location.href);
        if (u.origin !== location.origin) return null;
        return u.pathname.replace(/^[\\/]+/, '') + (u.search || '') + (u.hash || '');
      }catch(e){
        return null;
      }
    }

    async function discoverTools(){
      const grid = document.getElementById('toolsGrid');
      grid.innerHTML = '';

      // Strategy 1: manifest.json
      const manifestText = await tryFetchText('tools/manifest.json');
      let files = [];
      if (manifestText){
        try{ files = JSON.parse(manifestText); }catch(e){ files = []; }
      }

      // Strategy 2: directory listing HTML (some static hosts provide this)
      if (files.length === 0){
        const listing = await tryFetchText('tools/');
        if (listing){
          const doc = new DOMParser().parseFromString(listing, 'text/html');
          const anchors = Array.from(doc.querySelectorAll('a'));
          anchors.forEach(a => {
            const href = a.getAttribute('href') || a.href || '';
            if (!href) return;
            const norm = normalizeHref(href);
            if (!norm) return;
            if (/^tools\/.*\.html(\?.*)?(#.*)?$/i.test(norm)) files.push(norm);
          });
        }
      }

      // Strategy 3: fallback known file(s)
      if (files.length === 0){
        files = ['tools/CalendarExport.html', 'tools/Notifications.html'];
      }

      files = Array.from(new Set(files));

      const items = await Promise.all(files.map(async (path) => {
        if (!/\.html(\?.*)?(#.*)?$/i.test(path)) return null;
        const html = await tryFetchText(path);
        const title = html ? extractTitleFromHtml(html) : null;
        const display = title || path.split('/').pop();
        return {path, display};
      }));

      const final = items.filter(Boolean);
      if (final.length === 0){
        const p = document.createElement('p');
        p.className = 'lead';
        p.textContent = 'No tools found in the tools/ folder.';
        grid.appendChild(p);
        return;
      }

      final.forEach(it => {
        const a = document.createElement('a');
        a.className = 'tool';
        // Add a safe relative returnTo parameter so tools can navigate back to the menu.
        // Use a relative path from tools/ back to the site root index.
        const returnTo = encodeURIComponent('../index.html');
        const connector = it.path.includes('?') ? '&' : '?';
        a.href = it.path + connector + 'returnTo=' + returnTo;
        a.textContent = it.display;
        grid.appendChild(a);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      discoverTools();
    });
  </script>
  <script src="scripts/footer.js"></script>
</body>
</html>
