<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<meta name="description" content="Export Umbrella events from Plug.Events as JSON or CSV. Simple UI for selecting umbrella and date range.">
	<title>Calendar Export</title>
	<link rel="icon" type="image/x-icon" href="../favicon.ico">
	<link rel="preconnect" href="https://fonts.gstatic.com">
	<link rel="preload" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" as="style" onload="this.rel='stylesheet'">
	<noscript><link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet"></noscript>
	<!-- Critical CSS inlined to reduce critical request chain for LCP -->
	<style id="critical-css">
		:root{--accent:#0b6b5f;--bg:#ffffff;--muted:#6b6b6b}
		html,body{height:100%;margin:0;font-family:Inter, 'Open Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;background:#f5f7f8;color:#1b1b1b}
		.wrap{max-width:980px;margin:36px auto;padding:28px;background:var(--bg);box-shadow:0 6px 18px rgba(16,24,40,0.06);border-radius:8px}
		.top-actions{text-align:left;margin-bottom:12px}
		.backBtn{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;background:#fff;color:var(--accent);border:1px solid #d1e7e2;text-decoration:none;font-weight:600}
		h1{margin:0 0 12px;font-size:20px}
		p.lead{margin:0 0 18px;color:var(--muted)}
		.controls{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
		.field{display:flex;flex-direction:column;min-width:160px}
		input[type="text"],input[type="date"],button{padding:10px 12px;border:1px solid #e2e8f0;border-radius:6px;background:#fff;font-size:14px}
		.btn-row{display:flex;gap:8px;align-items:center}
		.field-hint{font-size:12px;margin-top:5px;min-height:16px;word-break:break-word}
		.field-hint.found{color:var(--accent)}
		.field-hint.notfound{color:#c0392b}
		/* Footer critical styles to avoid layout shift */
		.site-footer{background:transparent;margin-top:20px}
		.site-footer .footer{display:flex;gap:12px;justify-content:center;align-items:center;padding:12px 16px;border-top:1px solid #eef3f4;background:var(--bg);font-size:13px;color:var(--muted);flex-wrap:wrap}
		.site-footer .footer a{color:var(--accent);text-decoration:none;font-weight:600}
		.gh-icon{width:16px;height:16px;vertical-align:middle;margin-right:8px;fill:currentColor}
		.footer a span{vertical-align:middle}
	</style>
	<!-- Load the full stylesheet asynchronously after critical CSS applied -->
	<link rel="preload" href="../styles/site.css" as="style" onload="this.rel='stylesheet'">
	<noscript><link rel="stylesheet" href="../styles/site.css"></noscript>
	<!-- styles moved to ../styles/site.css -->
	<script src="../scripts/config.js"></script>
</head>

<body>
	<main role="main" class="wrap">
		<div class="top-actions">
			<a class="backBtn" id="backBtn" href="../index.html">← Menu</a>
		</div>
		<h1>Export Umbrella Events</h1>
		<p class="lead">Enter an umbrella name and date range to export events from Plug.Events.</p>

		<form id="exportForm" class="controls">
			<div class="field">
				<label for="umbrella">Umbrella</label>
				<input id="umbrella" name="umbrella" type="text" value="balfolk-nl" />
				<span id="umbrellaHint" class="field-hint" aria-live="polite"></span>
			</div>
			<div class="field">
				<label for="start">Start date</label>
				<input id="start" name="start" type="date" />
				<span class="field-hint"></span>
			</div>
			<div class="field">
				<label for="end">End date</label>
				<input id="end" name="end" type="date" />
				<span class="field-hint"></span>
			</div>
			<div class="field actions">
					<label>&nbsp;</label>
					<div class="btn-row">
					<button id="exportBtn" type="submit" class="primary" data-umbrella-gate disabled>Export</button>
					<button id="downloadCsvBtn" type="button" class="ghost" data-umbrella-gate disabled>Download as CSV</button>
					</div>
					<span class="field-hint"></span>
			</div>
		</form>

		<div id="status" class="note"></div>

		<div id="results">
			<table id="eventsTable" aria-live="polite">
				<thead>
					<tr><th>Name</th><th>Subtitle</th><th>Date</th></tr>
				</thead>
				<tbody></tbody>
			</table>
		</div>
	</main>

	<script src="../scripts/umbrella-validate.js"></script>
	<script>
	// Handle safe returnTo param: allows returning to a known same-origin page.
	(function(){
		const params = new URLSearchParams(location.search);
		const raw = params.get('returnTo');
		if (!raw) return;
		try{
			// decode the returned value in case it was encoded by the index page
			const decoded = decodeURIComponent(raw);
			const resolved = new URL(decoded);
			// only allow same-origin http(s) links
			//console.log('resolved', resolved);
			if ((resolved.protocol === 'http:' || resolved.protocol === 'https:')){
				// Use only the path+query+hash portion to avoid leaking origin
				const safePath = resolved.origin + resolved.pathname;
				const btn = document.getElementById('backBtn');
				//console.log('in if with btn', btn, safePath);
				if (btn) btn.setAttribute('href', safePath);
			}
		}catch(e){
			// ignore invalid values and keep default
			//console.log('invalid param');
		}
	})();

		const form = document.getElementById('exportForm');
		const umbrellaInput = document.getElementById('umbrella');
		const startInput = document.getElementById('start');
		const endInput = document.getElementById('end');
		const exportBtn = document.getElementById('exportBtn');
		const downloadCsvBtn = document.getElementById('downloadCsvBtn');
		const status = document.getElementById('status');
		const tbody = document.querySelector('#eventsTable tbody');

		function fmtText(s){return s==null? '': String(s)}

		form.addEventListener('submit', async (ev) => {
			ev.preventDefault();
			tbody.innerHTML = '';
			status.textContent = '';

			const umbrella = encodeURIComponent((umbrellaInput.value || 'balfolk-nl').trim());
			const start = startInput.value; // yyyy-mm-dd
			const end = endInput.value; // yyyy-mm-dd

			if (!start || !end){
				status.textContent = 'Please choose both start and end dates.';
				return;
			}

			const url = `${API_BASE_URL}/api/UmbrellaEvents?Umbrella=${umbrella}&StartDate=${encodeURIComponent(start)}&EndDate=${encodeURIComponent(end)}&Top=999`;

			// Use the direct API URL. When deployed as a static site the request should come
			// from an https origin and the API server may allow it. Browsers enforce CORS; if
			// you see CORS errors while testing locally, serve this folder over HTTP or deploy
			// to a static host (see README.md).
			const fetchUrl = url;

			exportBtn.disabled = true;
			status.textContent = 'Loading...';

			try{
				const res = await fetch(fetchUrl, {cache:'no-store'});
				if (!res.ok) throw new Error('Network response was not ok: ' + res.status);
				const data = await res.json();
				if (!Array.isArray(data) || data.length===0){
					status.textContent = 'No events returned for the selected range.';
					return;
				}

				status.textContent = `${data.length} events returned.`;
				const frag = document.createDocumentFragment();
				data.forEach(item => {
					const tr = document.createElement('tr');

					const nameCell = document.createElement('td');
					const slug = item.toSlug || '';
					const nameText = fmtText(item.toName) || '(no name)';
					if (slug){
						const a = document.createElement('a');
						a.href = `https://www.plug.events/event/${encodeURIComponent(slug)}`;
						a.target = '_blank';
						a.rel = 'noopener noreferrer';
						a.textContent = nameText;
						nameCell.appendChild(a);
					} else {
						nameCell.textContent = nameText;
					}

					const subtitleCell = document.createElement('td');
					subtitleCell.textContent = fmtText(item.toSubtitle);

					const createdCell = document.createElement('td');
					createdCell.textContent = fmtText(item.toEventReadableTime);

					tr.appendChild(nameCell);
					tr.appendChild(subtitleCell);
					tr.appendChild(createdCell);
					frag.appendChild(tr);
				});

				tbody.appendChild(frag);
			} catch (err) {
				console.error(err);
				// If this is a CORS-related failure in the browser, explain next steps.
				status.innerHTML = 'Error fetching events: ' + (err.message || err) +
					'<br><br>If you see a CORS error in the browser when testing locally, either:' +
					'<ul><li>Deploy this folder as a static web app (recommended), or</li><li>Serve the folder locally over HTTP (e.g. <code>python -m http.server 8000</code>) and open via <code>http://localhost:8000</code>.</li></ul>';
			} finally {
				exportBtn.disabled = !umbrellaIsValid;
			}
		});

		// CSV download: build same URL but request CSV format and open it to trigger download
		downloadCsvBtn.addEventListener('click', (ev) => {
			status.textContent = '';
			if (!umbrellaIsValid) {
				status.textContent = 'Please enter a valid umbrella name.';
				return;
			}
			const umbrella = encodeURIComponent((umbrellaInput.value || 'balfolk-nl').trim());
			const start = startInput.value;
			const end = endInput.value;
			if (!start || !end){
				status.textContent = 'Please choose both start and end dates.';
				return;
			}

			const url = `${API_BASE_URL}/api/UmbrellaEvents?Umbrella=${umbrella}&StartDate=${encodeURIComponent(start)}&EndDate=${encodeURIComponent(end)}&Top=999&format=CSV`;
			status.textContent = 'Starting CSV download...';
			// Open in new tab/window — server should return a CSV attachment
			window.open(url, '_blank');
		});
	</script>
	<script src="../scripts/footer.js"></script>
</body>
</html>
