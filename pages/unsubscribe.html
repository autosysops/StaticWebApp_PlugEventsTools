<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<meta name="description" content="Unsubscribe from Balfolk Workshop emails.">
	<title>Unsubscribe</title>
	<link rel="icon" type="image/x-icon" href="../favicon.ico">
	<!-- Critical CSS inlined to reduce critical request chain for LCP -->
	<style id="critical-css">
		:root{--accent:#0b6b5f;--bg:#ffffff;--muted:#6b6b6b}
		html,body{height:100%;margin:0;font-family:Inter, 'Open Sans', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;background:#f5f7f8;color:#1b1b1b}
		.wrap{max-width:980px;margin:36px auto;padding:28px;background:var(--bg);box-shadow:0 6px 18px rgba(16,24,40,0.06);border-radius:8px}
		.top-actions{text-align:left;margin-bottom:12px}
		.backBtn{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;background:#fff;color:var(--accent);border:1px solid #d1e7e2;text-decoration:none;font-weight:600}
		h1{margin:0 0 12px;font-size:20px}
		.status-msg{margin:18px 0;font-size:16px;color:var(--muted)}
		.status-msg.success{color:var(--accent);font-weight:600}
		.status-msg.error{color:#c0392b;font-weight:600}
		/* Footer critical styles to avoid layout shift */
		.site-footer{background:transparent;margin-top:20px}
		.site-footer .footer{display:flex;gap:12px;justify-content:center;align-items:center;padding:12px 16px;border-top:1px solid #eef3f4;background:var(--bg);font-size:13px;color:var(--muted);flex-wrap:wrap}
		.site-footer .footer a{color:var(--accent);text-decoration:none;font-weight:600}
		.gh-icon{width:16px;height:16px;vertical-align:middle;margin-right:8px;fill:currentColor}
		.footer a span{vertical-align:middle}
	</style>
	<link rel="preload" href="../styles/site.css" as="style" onload="this.rel='stylesheet'">
	<noscript><link rel="stylesheet" href="../styles/site.css"></noscript>
	<script src="../scripts/config.js"></script>
</head>

<body>
	<main role="main" class="wrap">
		<div class="top-actions">
			<a class="backBtn" href="../index.html">← Menu</a>
		</div>
		<h1>Unsubscribe</h1>
		<p id="statusMsg" class="status-msg">Please wait while we unsubscribe you…</p>
	</main>

	<script>
	(function () {
		function decodeBase64Url(str) {
			const base64 = str.replace(/-/g, '+').replace(/_/g, '/');
			const padded = base64 + '=='.slice(0, (4 - base64.length % 4) % 4);
			return atob(padded);
		}

		const msgEl = document.getElementById('statusMsg');

		function setStatus(text, type) {
			msgEl.textContent = text;
			msgEl.className = 'status-msg' + (type ? ' ' + type : '');
		}

		const params = new URLSearchParams(location.search);
		const rawId = params.get('id');
		const removeKey = params.get('RemoveKey');

		if (!rawId || !removeKey) {
			setStatus('Invalid unsubscribe link. Required parameters are missing.', 'error');
			return;
		}

		let id;
		try {
			id = decodeBase64Url(rawId);
		} catch (e) {
			setStatus('Invalid unsubscribe link. Could not decode the identifier.', 'error');
			return;
		}

		fetch(UNSUBSCRIBE_URL, {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify({
				type: 'email',
				id: id,
				RemoveKey: Number(removeKey)
			})
		})
		.then(function (res) {
			if (res.ok) {
				setStatus('You have been unsubscribed.', 'success');
			} else {
				setStatus('Something went wrong (status ' + res.status + '). Please try again later.', 'error');
			}
		})
		.catch(function (err) {
			setStatus('Could not reach the server. Please check your connection and try again.', 'error');
		});
	})();
	</script>

	<script src="../scripts/footer.js"></script>
</body>
</html>
